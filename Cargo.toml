[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
repository = "https://github.com/knoggin-memory/knoggin"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
todo = "deny"
dbg_macro = "deny"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
await_holding_lock = "deny"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 16
strip = "debuginfo"
overflow-checks = true

[profile.release.package."*"]
overflow-checks = false

[workspace.lints.cargo]
unused_dependencies = "allow"   # cargo-machete does this job, with fewer false alarms
unused_workspace_dependencies = "allow"    # new in Cargo 1.100, warn by default
unused_workspace_package_fields = "allow"  # new in Cargo 1.100, warn by default

[workspace.dependencies]
# Runtime and HTTP
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "io-std", "fs"] }
tokio-util = { version = "0.7", features = ["io", "io-util"] }
axum = { version = "0.8.9", features = ["http2"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "server", "server-auto", "server-graceful", "service", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["aws-lc-rs", "http1", "http2"] }
tower = { version = "0.5.3", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit", "request-id", "sensitive-headers", "catch-panic"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "logging", "tls12", "prefer-post-quantum"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
aws-lc-rs = "1.19"
zeroize = { version = "1.9", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream", "form", "query"] }
# AWS
aws-config = { version = "1.13", default-features = false, features = ["default-https-client", "rt-tokio", "sso", "credentials-process"] }
aws-sdk-s3 = { version = "1.159", default-features = false, features = ["default-https-client", "rt-tokio", "http-1x"] }
aws-sdk-dynamodb = { version = "1.139", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1.131", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ecs = { version = "1.159", default-features = false, features = ["default-https-client", "rt-tokio"] }
# Storage and data
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-aws-lc-rs", "migrate", "macros", "json"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
uuid = { version = "1.29", features = ["v7", "serde"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "serde", "macros"] }
toml = "1.2"
# Errors, logs, metrics, command line
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
clap = { version = "4.6", features = ["derive", "env"] }
# API description
utoipa = { version = "6.0", features = ["axum_extras", "uuid", "time"] }
utoipa-axum = "0.3"
ts-rs = { version = "12.0", features = ["uuid-impl", "serde-json-impl", "no-serde-warnings"] }
# Sign-in, containers, system
jsonwebtoken = { version = "12.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
bollard = "0.21.1"
rustix = { version = "1.1.6", features = ["process", "fs", "net"] }
# Embeddings and web UI
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "tracing"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
rust-embed = { version = "8.14", features = ["mime-guess"] }
# Small helpers
http = "1"
bytes = "1"
http-body-util = "0.1"
futures-util = "0.3"
base64 = "0.23"
# knoggin-import-recalld only
redb = "5.0"
crc32fast = "1.5"
# Dev only
proptest = "1.12"
insta = { version = "1.49", features = ["json", "redactions"] }
wiremock = "0.6.5"
assert_cmd = "2.2"
tempfile = "3.27"
criterion = "0.8.2"
testcontainers = { version = "0.28", default-features = false, features = ["aws-lc-rs"] }
rmcp = { version = "3.10", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
