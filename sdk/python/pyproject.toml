# SPDX-License-Identifier: Apache-2.0
[project]
name = "knoggin"
# The shared release version: release-please bumps it with Cargo.toml and ui/package.json.
version = "0.1.0"
description = "Python client for Knoggin, long-term memory for AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["memory", "agents", "mcp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.28", "pydantic>=2"]

[project.urls]
Homepage = "https://github.com/knoggin-memory/knoggin"
Repository = "https://github.com/knoggin-memory/knoggin"
Documentation = "https://github.com/knoggin-memory/knoggin/tree/main/docs"
Issues = "https://github.com/knoggin-memory/knoggin/issues"

[project.scripts]
knoggin = "knoggin.cli:main"

# One extra per framework adapter. `mcp` is held below 3: the OpenAI Agents adapter hands the
# framework an HTTP client whose class depends on the `mcp` major.
[project.optional-dependencies]
litellm = ["litellm>=1.110"]
pydantic-ai = ["pydantic-ai-slim>=2.71"]
openai-agents = ["openai-agents>=0.25", "mcp>=1,<3"]
langchain = ["langchain>=1.5"]
google-adk = ["google-adk>=2.15"]

# `dev` holds no framework. Each framework has a group of its own for its adapter tests, run in a
# CI job of its own; the groups conflict, so one lock file holds a resolution for each.
[dependency-groups]
dev = ["pytest", "respx", "ruff", "pyright", "mypy"]
litellm = ["knoggin[litellm]"]
pydantic-ai = ["knoggin[pydantic-ai]"]
openai-agents = ["knoggin[openai-agents]"]
langchain = ["knoggin[langchain]"]
google-adk = ["knoggin[google-adk]"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"
conflicts = [
    [
        { group = "litellm" },
        { group = "pydantic-ai" },
        { group = "openai-agents" },
        { group = "langchain" },
        { group = "google-adk" },
    ],
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "A", "S", "SIM", "RUF"]
ignore = ["A002", "E501", "S101", "S603", "S607"]  # A002: the API names its argument `id`

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "A002"]

# The adapter modules and their tests need their framework's group: each adapter job checks its own.
[tool.pyright]
include = ["src", "tests"]
exclude = ["src/knoggin/pydantic_ai.py", "src/knoggin/openai_agents.py", "tests/adapters"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportPrivateUsage = false

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
exclude = ['^src/knoggin/(pydantic_ai|openai_agents)\.py$', '^tests/adapters/']

# A bare `pytest` runs the core tests. The adapter tests run one framework at a time:
# `uv run --locked --group <framework> pytest tests/adapters/<framework>`.
[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract", "tests/test_openapi.py"]
