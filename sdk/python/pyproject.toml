[project]
name = "knoggin"
# The shared release version: release-please bumps it with Cargo.toml and ui/package.json.
version = "0.1.0"
description = "Python client for Knoggin, long-term memory for AI agents"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["memory", "agents", "mcp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.28", "pydantic>=2"]

[project.urls]
Homepage = "https://github.com/knoggin-memory/knoggin"
Repository = "https://github.com/knoggin-memory/knoggin"
Documentation = "https://github.com/knoggin-memory/knoggin/tree/main/docs"
Issues = "https://github.com/knoggin-memory/knoggin/issues"

[project.scripts]
knoggin = "knoggin.cli:main"

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai-slim>=2.71"]
openai-agents = ["openai-agents>=0.25"]

[dependency-groups]
dev = ["pytest", "respx", "ruff", "pyright", "mypy", "pydantic-ai-slim", "openai-agents"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "A", "S", "SIM", "RUF"]
ignore = ["A002", "E501", "S101", "S603", "S607"]  # A002: the API names its argument `id`

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "A002"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportPrivateUsage = false

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
