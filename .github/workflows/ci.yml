name: CI

# Every check a pull request and main must pass.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain that rust-toolchain.toml names.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            nextest: cargo-nextest-0.9.152-x86_64-unknown-linux-gnu.tar.gz
            sha256: d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a
          - runner: ubuntu-24.04-arm
            nextest: cargo-nextest-0.9.152-aarch64-unknown-linux-gnu.tar.gz
            sha256: ca1f81a5b86533eb45ab97e0064aa88e925e53aab9a698ca6331a7cad1f85f07
          - runner: macos-15
            nextest: cargo-nextest-0.9.152-universal-apple-darwin.tar.gz
            sha256: 2fadf57df4243e691f088ee3bff4f4ab9af16da0c95a1db84b5cb1685e098a76
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        env:
          ARCHIVE: ${{ matrix.nextest }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$ARCHIVE" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/$ARCHIVE"
          echo "$SHA256  $RUNNER_TEMP/$ARCHIVE" | shasum -a 256 -c -
          # The macOS runner has no ~/.cargo/bin, so tools go to a directory of their own on PATH.
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/bin" cargo-nextest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --doc --workspace --locked

  # The stack tier: tests named stack_*.rs, against stand-in containers that
  # tests/images.toml pins by digest, and the one-host stack, whose image the first
  # stack test builds from deploy/Dockerfile. The runner image has Docker.
  stack:
    runs-on: ubuntu-24.04
    # The one-host stack tests build the knoggin:test image first.
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nextest.tar.gz" https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-x86_64-unknown-linux-gnu.tar.gz
          echo "d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a  $RUNNER_TEMP/nextest.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$HOME/.cargo/bin" cargo-nextest
      # stack_sdk.rs runs the SDK's contract tests with uv, as the sdk job does.
      - name: Install uv
        run: |
          curl -fsSL -o "$RUNNER_TEMP/uv.whl" https://files.pythonhosted.org/packages/3d/aa/26d64642d808de4a652579ef950d7cd2d37f080a8babf9c67c6b75fc4c3f/uv-0.13.9-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          echo "d7f459fe4fd247d830351c75686d3996ace3c6f3f728eb0e85a30b7ada0cef19  $RUNNER_TEMP/uv.whl" | sha256sum -c -
          unzip -j -o "$RUNNER_TEMP/uv.whl" uv-0.13.9.data/scripts/uv -d "$HOME/.cargo/bin"
          chmod +x "$HOME/.cargo/bin/uv"
          uv python install 3.15.2
      - run: cargo nextest run --workspace --locked --profile ci --run-ignored only -E 'kind(test) & binary(#stack_*)'
        env:
          UV_PYTHON: "3.15.2"
          UV_PYTHON_DOWNLOADS: manual

  budgets:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nextest.tar.gz" https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-aarch64-unknown-linux-gnu.tar.gz
          echo "ca1f81a5b86533eb45ab97e0064aa88e925e53aab9a698ca6331a7cad1f85f07  $RUNNER_TEMP/nextest.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$HOME/.cargo/bin" cargo-nextest
      # --no-capture prints the latency table on a pass too, so the numbers can be recorded.
      - name: Budget tier
        run: cargo nextest run -p knoggin-core --release --locked --run-ignored only -E 'binary(budgets)' --no-capture

  doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # fuzz/ is a workspace of its own. A bump in the root workspace can leave its lock
      # file behind, which only the weekly fuzz job would notice.
      - name: fuzz/Cargo.lock matches
        run: cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null
      - name: Install cargo-deny
        run: |
          curl -fsSL -o "$RUNNER_TEMP/deny.tar.gz" https://github.com/EmbarkStudios/cargo-deny/releases/download/0.21.0/cargo-deny-0.21.0-x86_64-unknown-linux-musl.tar.gz
          echo "a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903  $RUNNER_TEMP/deny.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tar.gz" -C "$HOME/.cargo/bin" --strip-components=1 cargo-deny-0.21.0-x86_64-unknown-linux-musl/cargo-deny
      - run: cargo deny check

  machete:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-machete
        run: |
          curl -fsSL -o "$RUNNER_TEMP/machete.tar.gz" https://github.com/bnjbvr/cargo-machete/releases/download/v0.10.1/cargo-machete-v0.10.1-x86_64-unknown-linux-musl.tar.gz
          echo "785d381985140ffa172246d82089adeb7f2eb9c774d961c48f77a4494023afb5  $RUNNER_TEMP/machete.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/machete.tar.gz" -C "$HOME/.cargo/bin" --strip-components=1 cargo-machete-v0.10.1-x86_64-unknown-linux-musl/cargo-machete
      # Called directly: it reads the manifests and sources and needs no toolchain.
      - run: cargo-machete

  # Regenerates docs/openapi.json and the web UI's TypeScript types with their explicit
  # steps, and fails when either differs from what is committed.
  openapi:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nextest.tar.gz" https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-x86_64-unknown-linux-gnu.tar.gz
          echo "d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a  $RUNNER_TEMP/nextest.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$HOME/.cargo/bin" cargo-nextest
      - run: cargo nextest run -p knoggin-http --locked --run-ignored only -E 'test(write_openapi) | test(export_ui_types)'
      - name: The committed files are current
        run: |
          git status --porcelain -- docs/openapi.json ui/src/lib/api/types
          test -z "$(git status --porcelain -- docs/openapi.json ui/src/lib/api/types)"

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint and zizmor
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          curl -fsSL -o "$RUNNER_TEMP/zizmor.tar.gz" https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP/bin" zizmor
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # actionlint runs shellcheck on `run:` scripts; the runner image has it.
      - run: actionlint
      # The token lets zizmor's online audits check that pinned commits belong
      # to the action's repository and that no pinned version has an advisory.
      - run: zizmor --format=github .github
        env:
          GH_TOKEN: ${{ github.token }}

  # The deploy tier: the AWS module checked offline. `tofu test` runs against a mock
  # provider; nothing here has or needs an AWS credential. The provider comes from the
  # registry and must match the hashes in the committed lock files.
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenTofu
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tofu.tar.gz" https://github.com/opentofu/opentofu/releases/download/v1.13.9/tofu_1.13.9_linux_amd64.tar.gz
          echo "b34b327cc1ef07178207b6f2cd1f5276537d3e5b7be316500f6dac50d4c0a857  $RUNNER_TEMP/tofu.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/tofu.tar.gz" -C "$RUNNER_TEMP/bin" tofu
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: tofu fmt -check -recursive
        working-directory: deploy/aws
      - run: tofu init -backend=false -input=false -lockfile=readonly
        working-directory: deploy/aws
      - run: tofu validate
        working-directory: deploy/aws
      - run: tofu test
        working-directory: deploy/aws
      - run: tofu init -backend=false -input=false -lockfile=readonly
        working-directory: deploy/aws/examples/complete
      - run: tofu validate
        working-directory: deploy/aws/examples/complete

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 26 LTS and pnpm, as prebuilt archives checked against their SHA-256.
      - name: Install Node and pnpm
        run: |
          curl -fsSL -o "$RUNNER_TEMP/node.tar.xz" https://nodejs.org/dist/v26.13.1/node-v26.13.1-linux-x64.tar.xz
          echo "5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          curl -fsSL -o "$RUNNER_TEMP/pnpm.tar.gz" https://github.com/pnpm/pnpm/releases/download/v12.21.0/pnpm-linux-x64.tar.gz
          echo "84c4773bcf4a217f4083cd7b2a91e4cee6103cf42426c1282ef37d308f55a410  $RUNNER_TEMP/pnpm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node" "$RUNNER_TEMP/pnpm"
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          tar -xzf "$RUNNER_TEMP/pnpm.tar.gz" -C "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui lint
      - run: pnpm -C ui check
      - run: pnpm -C ui test
      - run: pnpm -C ui build

  # The UI is built first: a release daemon embeds ui/dist (a debug build reads it from disk).
  web-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 26 LTS and pnpm, as prebuilt archives checked against their SHA-256.
      - name: Install Node and pnpm
        run: |
          curl -fsSL -o "$RUNNER_TEMP/node.tar.xz" https://nodejs.org/dist/v26.13.1/node-v26.13.1-linux-x64.tar.xz
          echo "5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          curl -fsSL -o "$RUNNER_TEMP/pnpm.tar.gz" https://github.com/pnpm/pnpm/releases/download/v12.21.0/pnpm-linux-x64.tar.gz
          echo "84c4773bcf4a217f4083cd7b2a91e4cee6103cf42426c1282ef37d308f55a410  $RUNNER_TEMP/pnpm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node" "$RUNNER_TEMP/pnpm"
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          tar -xzf "$RUNNER_TEMP/pnpm.tar.gz" -C "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui build
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked -p knoggin
      # The browser at the version the lockfile's Playwright names, with its system libraries.
      - run: pnpm -C ui exec playwright install --with-deps chromium
      - run: pnpm -C ui test:e2e
        env:
          KNOGGIN_BIN: ${{ github.workspace }}/target/release/knoggin
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-results
          path: ui/test-results/
          retention-days: 7

  # The SDK tier: unit tests, and contract tests against a daemon built from this commit
  # and started in test mode, on the lowest and the highest supported Python; the linters
  # and type checkers the SDK uses; `uv build`; and the integrations test. uv comes
  # from its PyPI wheel, checked against its SHA-256; uv checks the Python builds it
  # downloads itself.
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk/python
    env:
      UV_PYTHON_DOWNLOADS: manual
      KNOGGIN_BIN: ${{ github.workspace }}/target/debug/knoggin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        run: |
          curl -fsSL -o "$RUNNER_TEMP/uv.whl" https://files.pythonhosted.org/packages/3d/aa/26d64642d808de4a652579ef950d7cd2d37f080a8babf9c67c6b75fc4c3f/uv-0.13.9-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          echo "d7f459fe4fd247d830351c75686d3996ace3c6f3f728eb0e85a30b7ada0cef19  $RUNNER_TEMP/uv.whl" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -j -o "$RUNNER_TEMP/uv.whl" uv-0.13.9.data/scripts/uv -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/uv"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: uv python install 3.11.18 3.15.2
      # The integrations test: plugin, registry and snippet files, and their versions.
      - run: uv run --no-project --python 3.15.2 --with pytest==9.2.0 --with pyyaml==6.0.4 python -m pytest integrations/tests -q
        working-directory: .
      - run: rustup toolchain install
        working-directory: .
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p knoggin --locked
        working-directory: .
      - run: uv run --locked --python 3.11.18 pytest
      - run: uv run --locked --python 3.15.2 pytest
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pyright
      - run: uv run --locked mypy
      - run: uv build

  deps:
    # Dependency review needs GitHub Advanced Security on a private repository,
    # so it runs once the repository is public.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # The one required check. Skipped jobs (deps and dco on a push) count as passed.
  ci-ok:
    if: always()
    needs: [fmt, clippy, test, stack, budgets, doc, deny, machete, openapi, workflows, web, web-e2e, sdk, deploy, deps, dco]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a required job ended with: $r"; exit 1 ;;
            esac
          done
