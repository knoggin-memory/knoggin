name: Release

# Tab "Testing, CI, releases", Releases. release-please keeps a release pull request
# open; merging it makes a draft release and the tag vX.Y.Z, and the jobs below build,
# sign, attest and publish that release. scripts/release-dry-run.sh runs the same
# build-archive.sh and release-assets.sh on one machine, without publishing anything.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/knoggin-memory/knoggin

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # release-please bumps workspace.package.version; Cargo.lock follows here, on the
      # release pull request's branch.
      - if: steps.release.outputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          persist-credentials: false
      - if: steps.release.outputs.pr
        name: Cargo.lock follows the new version
        env:
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup toolchain install
          cargo update --workspace
          if git diff --quiet -- Cargo.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --signoff --message "chore: update Cargo.lock for the release" -- Cargo.lock
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"

  # The web UI is the same on every target, so it is built once and handed to each build.
  ui:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Install Node and pnpm
        run: |
          curl -fsSL -o "$RUNNER_TEMP/node.tar.xz" https://nodejs.org/dist/v26.13.1/node-v26.13.1-linux-x64.tar.xz
          echo "5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          curl -fsSL -o "$RUNNER_TEMP/pnpm.tar.gz" https://github.com/pnpm/pnpm/releases/download/v12.21.0/pnpm-linux-x64.tar.gz
          echo "84c4773bcf4a217f4083cd7b2a91e4cee6103cf42426c1282ef37d308f55a410  $RUNNER_TEMP/pnpm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node" "$RUNNER_TEMP/pnpm"
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          tar -xzf "$RUNNER_TEMP/pnpm.tar.gz" -C "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/dist/
          if-no-files-found: error
          retention-days: 1

  # One archive per target, each on a native runner, without a cache. Ubuntu 22.04 gives
  # the glibc floor of 2.35.
  build:
    needs: [release-please, ui]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            auditable: cargo-auditable-x86_64-unknown-linux-gnu.tar.xz
            auditable_sha256: 4c8d3b08c3c34e9f2333367224dbbfb4aab68067698b43de59fe19aded3416dd
            about: cargo-about-0.9.3-x86_64-unknown-linux-musl.tar.gz
            about_sha256: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            auditable: cargo-auditable-aarch64-unknown-linux-gnu.tar.xz
            auditable_sha256: bcb2d46002a8dd8e94d0d669cb39d38c9651db2ae5d1f3f1f1bab516ee1e212c
            about: cargo-about-0.9.3-aarch64-unknown-linux-musl.tar.gz
            about_sha256: eb4d9ff6ebd2518152a8308729431a04b3836e71d2bd5ead7aea69f91a71162e
          - target: aarch64-apple-darwin
            runner: macos-15
            auditable: cargo-auditable-aarch64-apple-darwin.tar.xz
            auditable_sha256: a66ad6392861ca1abfe0b02b522622d91edf63e5d7b60f4d3088b5c23d240c72
            about: cargo-about-0.9.3-aarch64-apple-darwin.tar.gz
            about_sha256: 45520df8680978a6e7c4023ace0e3f311c73efc208cd68e5a7f4ed4822fa0349
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - run: rustup toolchain install
      - name: Install cargo-auditable and cargo-about
        env:
          AUDITABLE: ${{ matrix.auditable }}
          AUDITABLE_SHA256: ${{ matrix.auditable_sha256 }}
          ABOUT: ${{ matrix.about }}
          ABOUT_SHA256: ${{ matrix.about_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/$AUDITABLE" "https://github.com/rust-secure-code/cargo-auditable/releases/download/v0.7.7/$AUDITABLE"
          echo "$AUDITABLE_SHA256  $RUNNER_TEMP/$AUDITABLE" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/$AUDITABLE" -C "$RUNNER_TEMP/bin" --strip-components=1 "${AUDITABLE%.tar.xz}/cargo-auditable"
          curl -fsSL -o "$RUNNER_TEMP/$ABOUT" "https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.3/$ABOUT"
          echo "$ABOUT_SHA256  $RUNNER_TEMP/$ABOUT" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$ABOUT" -C "$RUNNER_TEMP/bin" --strip-components=1 "${ABOUT%.tar.gz}/cargo-about"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the archive
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/build-archive.sh "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # One image per platform on a native runner, pushed by digest only; the image job joins
  # them under the release's tags.
  image-build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Build and push by digest, with an SBOM
        env:
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # moby/buildkit:v0.35.0
          docker buildx create --use --driver docker-container \
            --driver-opt image=moby/buildkit@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build . --file deploy/Dockerfile --platform "$PLATFORM" \
            --sbom=true --provenance=mode=max \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/metadata.json"
          mkdir -p "$RUNNER_TEMP/digests"
          jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json" > "$RUNNER_TEMP/digests/${PLATFORM#linux/}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    needs: [release-please, image-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.join.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - id: join
        name: Tag the multi-platform image
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # X.Y.Z is pushed once and never moved; X.Y and latest move.
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION exists already"
            exit 1
          fi
          set --
          for f in "$RUNNER_TEMP"/digests/*; do set -- "$@" "$IMAGE@$(cat "$f")"; done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:${VERSION%.*}" --tag "$IMAGE:latest" "$@"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.join.outputs.digest }}
          push-to-registry: true
      - name: Install cosign and grype
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/cosign" https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/cosign"
          curl -fsSL -o "$RUNNER_TEMP/grype.tar.gz" https://github.com/anchore/grype/releases/download/v0.122.1/grype_0.122.1_linux_amd64.tar.gz
          echo "f1ba7e2917ee1395618de20a98da0aa7c0fb1788927797651047c50502a37538  $RUNNER_TEMP/grype.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP/bin" grype
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Keyless: the certificate names this workflow, which is what `cosign verify` checks.
      - name: Sign the digest
        env:
          DIGEST: ${{ steps.join.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Scan, failing on a critical finding that has a fix
        env:
          DIGEST: ${{ steps.join.outputs.digest }}
        run: grype "registry:$IMAGE@$DIGEST" --only-fixed --fail-on critical

  publish:
    needs: [release-please, build, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Install syft
        run: |
          curl -fsSL -o "$RUNNER_TEMP/syft.tar.gz" https://github.com/anchore/syft/releases/download/v1.57.2/syft_1.57.2_linux_amd64.tar.gz
          echo "ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP/bin" syft
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: SBOMs, the stamped install.sh and SHA256SUMS
        run: |
          scripts/release-assets.sh dist
          if grep -n '@VERSION@\|@SHA256_' dist/install.sh; then
            echo "::error::install.sh is missing a stamp"
            exit 1
          fi
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-sh
          path: dist/install.sh
          if-no-files-found: error
          retention-days: 1
      # The bundle lets cosign check an archive without the GitHub API (install.sh does).
      - name: Upload, add the image digest to the notes, publish the draft
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$BUNDLE" "dist/knoggin-$VERSION.sigstore.json"
          gh release upload "$TAG" dist/*
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          printf '\n## Container image\n\n`%s@%s`\n' "$IMAGE" "$DIGEST" >> "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --draft=false --latest

  # Last, after one manual approval of the pypi environment. The package carries the
  # release's stamped install.sh, which `knoggin init` runs.
  pypi:
    needs: [release-please, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-sh
          path: sdk/python/src/knoggin/cli
      - name: Install uv
        run: |
          curl -fsSL -o "$RUNNER_TEMP/uv.whl" https://files.pythonhosted.org/packages/3d/aa/26d64642d808de4a652579ef950d7cd2d37f080a8babf9c67c6b75fc4c3f/uv-0.13.9-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          echo "d7f459fe4fd247d830351c75686d3996ace3c6f3f728eb0e85a30b7ada0cef19  $RUNNER_TEMP/uv.whl" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -j -o "$RUNNER_TEMP/uv.whl" uv-0.13.9.data/scripts/uv -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/uv"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: uv build
      - run: uv publish --trusted-publishing always
