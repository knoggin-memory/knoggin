name: Release

# Tab "Testing, CI, releases", Releases. release-please keeps a release pull request
# open; merging it makes a draft release and the tag vX.Y.Z, and the jobs below build,
# sign, attest and publish that release. scripts/release-dry-run.sh runs the same
# build-archive.sh and release-assets.sh on one machine, without publishing anything.

on:
  push:
    branches: [main]

permissions: {}

# No workflow-wide concurrency: a run that waits for the pypi approval must not hold
# back release-please on later pushes. The jobs that must not overlap between runs
# have groups of their own; pypi has none, since PyPI versions do not interfere.

env:
  CARGO_BUILD_WARNINGS: deny
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/knoggin-memory/knoggin
  # The build matrix's targets, which assets and publish expect one archive each of.
  TARGETS: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The App's two secrets live in this environment, which deploys from main only.
    environment: release-please
    concurrency:
      group: release-please
      cancel-in-progress: false
    # Everything that writes uses the App token; the workflow token only reads.
    permissions:
      contents: read
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A token of the project's GitHub App, not the workflow's own: the workflow token
      # may not open pull requests here, and a pull request it opened or a branch it
      # pushed would start no CI, so the release pull request would never get `ci-ok`.
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The release pull request's branch, read in a step so that no expression parses
      # an empty output when there is no pull request.
      - id: pr
        if: steps.release.outputs.pr
        env:
          PR: ${{ steps.release.outputs.pr }}
        run: echo "branch=$(jq -r .headBranchName <<<"$PR")" >> "$GITHUB_OUTPUT"
      # release-please bumps workspace.package.version and sdk/python/pyproject.toml;
      # Cargo.lock and sdk/python/uv.lock follow here, on the release pull request's
      # branch, because CI's `--locked` checks fail on a lock file that names the old one.
      - if: steps.release.outputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.branch }}
          persist-credentials: false
      - if: steps.release.outputs.pr
        name: Install uv
        run: |
          curl -fsSL -o "$RUNNER_TEMP/uv.whl" https://files.pythonhosted.org/packages/3d/aa/26d64642d808de4a652579ef950d7cd2d37f080a8babf9c67c6b75fc4c3f/uv-0.13.9-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          echo "d7f459fe4fd247d830351c75686d3996ace3c6f3f728eb0e85a30b7ada0cef19  $RUNNER_TEMP/uv.whl" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -j -o "$RUNNER_TEMP/uv.whl" uv-0.13.9.data/scripts/uv -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/uv"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # No token here: rustup, cargo and uv run in this step.
      - if: steps.release.outputs.pr
        id: lock
        name: The lock files follow the new version
        run: |
          rustup toolchain install
          cargo update --workspace
          # Only the project's own entry in uv.lock changes: it is set in place, and uv
          # checks the result offline, so nothing is resolved again.
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("sdk/python/pyproject.toml", "rb"))["project"]["version"])')
          awk -v v="$version" '
            /^\[\[package\]\]$/ { p = 0 }
            /^name = "knoggin"$/ { p = 1 }
            p && /^version = / { $0 = "version = \"" v "\""; p = 0 }
            { print }
          ' sdk/python/uv.lock > "$RUNNER_TEMP/uv.lock"
          mv "$RUNNER_TEMP/uv.lock" sdk/python/uv.lock
          (cd sdk/python && uv lock --offline --check)
          if git diff --quiet -- Cargo.lock sdk/python/uv.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --signoff --message "chore: update the lock files for the release" -- Cargo.lock sdk/python/uv.lock
          echo "committed=true" >> "$GITHUB_OUTPUT"
      # The App token reaches git only through a credential helper that prints it from the
      # environment: it is in no command line, no URL and no file.
      - if: steps.lock.outputs.committed == 'true'
        name: Push the lock files to the release pull request's branch
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # shellcheck disable=SC2016 # the helper's shell expands $1 and $GH_TOKEN
          git -c credential.helper= \
            -c credential.helper='!f() { if [ "$1" = get ]; then echo username=x-access-token; echo "password=$GH_TOKEN"; fi; }; f' \
            push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"

  # The web UI is the same on every target, so it is built once and handed to each build.
  # Its hash goes along as a job output, which no other job can change (an artifact could
  # be replaced by any job of the run).
  ui:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Install Node and pnpm
        run: |
          curl -fsSL -o "$RUNNER_TEMP/node.tar.xz" https://nodejs.org/dist/v26.13.1/node-v26.13.1-linux-x64.tar.xz
          echo "5c063e46bab0fbc1c17cc445d7ff129cbdcd0471be6ed83b6ab864f8143bc864  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          curl -fsSL -o "$RUNNER_TEMP/pnpm.tar.gz" https://github.com/pnpm/pnpm/releases/download/v12.21.0/pnpm-linux-x64.tar.gz
          echo "84c4773bcf4a217f4083cd7b2a91e4cee6103cf42426c1282ef37d308f55a410  $RUNNER_TEMP/pnpm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node" "$RUNNER_TEMP/pnpm"
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          tar -xzf "$RUNNER_TEMP/pnpm.tar.gz" -C "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/pnpm" >> "$GITHUB_PATH"
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui build
      # One SHA-256 over every file's name and SHA-256; build computes it the same way.
      - id: hash
        run: echo "sha256=$(cd ui/dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/dist/
          if-no-files-found: error
          retention-days: 1

  # One archive per target, each on a native runner, without a cache. Ubuntu 22.04 gives
  # the glibc floor of 2.35. Each archive's SHA-256 goes to assets and publish as a job
  # output, one per target (each leg sets only its own).
  build:
    needs: [release-please, ui]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            auditable: cargo-auditable-x86_64-unknown-linux-gnu.tar.xz
            auditable_sha256: 4c8d3b08c3c34e9f2333367224dbbfb4aab68067698b43de59fe19aded3416dd
            about: cargo-about-0.9.3-x86_64-unknown-linux-musl.tar.gz
            about_sha256: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            auditable: cargo-auditable-aarch64-unknown-linux-gnu.tar.xz
            auditable_sha256: bcb2d46002a8dd8e94d0d669cb39d38c9651db2ae5d1f3f1f1bab516ee1e212c
            about: cargo-about-0.9.3-aarch64-unknown-linux-musl.tar.gz
            about_sha256: eb4d9ff6ebd2518152a8308729431a04b3836e71d2bd5ead7aea69f91a71162e
          - target: aarch64-apple-darwin
            runner: macos-15
            auditable: cargo-auditable-aarch64-apple-darwin.tar.xz
            auditable_sha256: a66ad6392861ca1abfe0b02b522622d91edf63e5d7b60f4d3088b5c23d240c72
            about: cargo-about-0.9.3-aarch64-apple-darwin.tar.gz
            about_sha256: 45520df8680978a6e7c4023ace0e3f311c73efc208cd68e5a7f4ed4822fa0349
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      x86_64-unknown-linux-gnu: ${{ steps.hash.outputs['x86_64-unknown-linux-gnu'] }}
      aarch64-unknown-linux-gnu: ${{ steps.hash.outputs['aarch64-unknown-linux-gnu'] }}
      aarch64-apple-darwin: ${{ steps.hash.outputs['aarch64-apple-darwin'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - name: Check the web UI against the ui job's hash
        env:
          WANT: ${{ needs.ui.outputs.sha256 }}
        run: |
          got=$(cd ui/dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)
          [ "$got" = "$WANT" ] || { echo "::error::ui/dist is not what the ui job built"; exit 1; }
      - run: rustup toolchain install
      - name: Install cargo-auditable and cargo-about
        env:
          AUDITABLE: ${{ matrix.auditable }}
          AUDITABLE_SHA256: ${{ matrix.auditable_sha256 }}
          ABOUT: ${{ matrix.about }}
          ABOUT_SHA256: ${{ matrix.about_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/$AUDITABLE" "https://github.com/rust-secure-code/cargo-auditable/releases/download/v0.7.7/$AUDITABLE"
          echo "$AUDITABLE_SHA256  $RUNNER_TEMP/$AUDITABLE" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/$AUDITABLE" -C "$RUNNER_TEMP/bin" --strip-components=1 "${AUDITABLE%.tar.xz}/cargo-auditable"
          curl -fsSL -o "$RUNNER_TEMP/$ABOUT" "https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.3/$ABOUT"
          echo "$ABOUT_SHA256  $RUNNER_TEMP/$ABOUT" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$ABOUT" -C "$RUNNER_TEMP/bin" --strip-components=1 "${ABOUT%.tar.gz}/cargo-about"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the archive
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/build-archive.sh "$TARGET"
      - id: hash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -- dist/*.tar.gz
          [ $# -eq 1 ] && [ -f "$1" ]
          echo "$TARGET=$(shasum -a 256 "$1" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # The real-model tier (tab "Testing, CI, releases") runs before a release as well as
  # weekly; nothing is tagged or published unless it passes. The model is downloaded,
  # not restored from a cache, like everything else a release builds from.
  real-model:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Install cargo-nextest
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nextest.tar.gz" https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-x86_64-unknown-linux-gnu.tar.gz
          echo "d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a  $RUNNER_TEMP/nextest.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$HOME/.cargo/bin" cargo-nextest
      # Both downloads check every file against its pinned SHA-256.
      - run: scripts/fetch-onnxruntime.sh x86_64-unknown-linux-gnu
      - run: cargo run --locked -p knoggin-embed --example fetch_model -- --dir "$RUNNER_TEMP/models"
      - run: cargo nextest run -p knoggin-embed --locked --run-ignored only -E 'binary(real_model)'
        env:
          KNOGGIN_MODEL__DIR: ${{ runner.temp }}/models
          ORT_DYLIB_PATH: ${{ github.workspace }}/target/onnxruntime/x86_64-unknown-linux-gnu/libonnxruntime.so

  # One image per platform on a native runner, pushed by digest only. Each digest goes to
  # image-push as a job output, which no other job can change (an artifact could be
  # replaced by any job of the run).
  image-build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    # One output per platform: each leg sets only its own.
    outputs:
      amd64: ${{ steps.push.outputs.amd64 }}
      arm64: ${{ steps.push.outputs.arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - id: push
        name: Build and push by digest, with an SBOM
        env:
          PLATFORM: ${{ matrix.platform }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # moby/buildkit:v0.35.0
          docker buildx create --use --driver docker-container \
            --driver-opt image=moby/buildkit@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build . --file deploy/Dockerfile --platform "$PLATFORM" \
            --sbom=true --provenance=mode=max \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/metadata.json"
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")
          grep -Eqx 'sha256:[0-9a-f]{64}' <<<"$digest"
          echo "${PLATFORM#linux/}=$digest" >> "$GITHUB_OUTPUT"

  # The image is pushed by digest only (image-push), then scanned in a job that can
  # neither sign nor push (image-scan), then attested and signed (image); only an image
  # that passed all of that gets the tag X.Y.Z. X.Y and latest move after the release is
  # published (image-tags).
  image-push:
    needs: [release-please, image-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.join.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - id: join
        name: Push the multi-platform index by digest
        env:
          AMD64: ${{ needs.image-build.outputs.amd64 }}
          ARM64: ${{ needs.image-build.outputs.arm64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for d in "$AMD64" "$ARM64"; do
            grep -Eqx 'sha256:[0-9a-f]{64}' <<<"$d" || { echo "::error::image-build handed over '$d', not a digest"; exit 1; }
          done
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --dry-run "$IMAGE@$AMD64" "$IMAGE@$ARM64" > "$RUNNER_TEMP/index.json"
          digest="sha256:$(sha256sum "$RUNNER_TEMP/index.json" | cut -d' ' -f1)"
          scripts/put-manifest.sh "$IMAGE" "$RUNNER_TEMP/index.json" "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The jobs that tag check it against the digest before they use it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-index
          path: ${{ runner.temp }}/index.json
          if-no-files-found: error
          retention-days: 1

  image-scan:
    needs: image-push
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: read
    steps:
      - name: Install grype
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/grype.tar.gz" https://github.com/anchore/grype/releases/download/v0.122.1/grype_0.122.1_linux_amd64.tar.gz
          echo "f1ba7e2917ee1395618de20a98da0aa7c0fb1788927797651047c50502a37538  $RUNNER_TEMP/grype.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP/bin" grype
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan each platform, failing on a critical finding that has a fix
        env:
          DIGEST: ${{ needs.image-push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for platform in linux/amd64 linux/arm64; do
            echo "== $platform"
            grype "registry:$IMAGE@$DIGEST" --platform "$platform" --only-fixed --fail-on critical
          done

  image:
    needs: [release-please, image-push, image-scan, real-model]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ needs.image-push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-index
          path: ${{ runner.temp }}/image-index
      - name: Check the index against its digest
        env:
          DIGEST: ${{ needs.image-push.outputs.digest }}
        run: echo "${DIGEST#sha256:}  $RUNNER_TEMP/image-index/index.json" | sha256sum --strict -c -
      - name: Install cosign
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/cosign" https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Sign in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image-push.outputs.digest }}
          push-to-registry: true
      # Keyless: the certificate names this workflow, which is what `cosign verify` checks.
      - name: Sign the digest
        env:
          DIGEST: ${{ needs.image-push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      # X.Y.Z is pushed once and never moved. A re-run after a failed check above finds
      # no tag and goes on; one that finds X.Y.Z on another image stops here.
      - name: Tag X.Y.Z
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/put-manifest.sh --keep "$IMAGE" "$RUNNER_TEMP/image-index/index.json" "$VERSION"

  # The SBOMs (syft), the stamped install.sh and SHA256SUMS, made in a job that can
  # neither sign nor write. Each archive comes by its exact name, into a folder of its
  # own, and must be the one its build job made.
  assets:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sums: ${{ steps.assets.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/archives/x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-aarch64-unknown-linux-gnu
          path: ${{ runner.temp }}/archives/aarch64-unknown-linux-gnu
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-aarch64-apple-darwin
          path: ${{ runner.temp }}/archives/aarch64-apple-darwin
      - name: Check each archive against its build job's SHA-256
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          BUILT: ${{ toJSON(needs.build.outputs) }}
        run: |
          mkdir dist
          for target in $TARGETS; do
            dir="$RUNNER_TEMP/archives/$target"
            name="knoggin-$VERSION-$target.tar.gz"
            if [ "$(find "$dir" -mindepth 1 -printf '%P\n')" != "$name" ]; then
              echo "::error::archive-$target holds other files than just $name"
              exit 1
            fi
            want=$(jq -er --arg t "$target" '.[$t] | select(test("^[0-9a-f]{64}$"))' <<<"$BUILT") \
              || { echo "::error::build handed over no SHA-256 for $target"; exit 1; }
            echo "$want  $dir/$name" | sha256sum --strict -c -
            mv "$dir/$name" dist/
          done
      - name: Install syft
        run: |
          curl -fsSL -o "$RUNNER_TEMP/syft.tar.gz" https://github.com/anchore/syft/releases/download/v1.57.2/syft_1.57.2_linux_amd64.tar.gz
          echo "ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP/bin" syft
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - id: assets
        name: SBOMs, the stamped install.sh and SHA256SUMS
        run: |
          scripts/release-assets.sh dist
          if grep -n '@VERSION@\|@SHA256_' dist/install.sh; then
            echo "::error::install.sh is missing a stamp"
            exit 1
          fi
          echo "sums=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [release-please, build, assets, real-model, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      install_sh: ${{ steps.check.outputs.install_sh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      # Nothing from assets is taken on trust (syft ran there): each archive must be the
      # one its build job made, and install.sh is stamped again here from this checkout
      # and those hashes, the way scripts/release-assets.sh stamps it.
      - id: check
        name: Check every file before anything is attested
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          BUILT: ${{ toJSON(needs.build.outputs) }}
          SUMS: ${{ needs.assets.outputs.sums }}
        run: |
          cd dist
          echo "$SUMS  SHA256SUMS" | sha256sum --strict -c -
          sha256sum --strict -c SHA256SUMS
          expected=(install.sh)
          stamp="s/@VERSION@/$VERSION/g"
          for target in $TARGETS; do
            want=$(jq -er --arg t "$target" '.[$t] | select(test("^[0-9a-f]{64}$"))' <<<"$BUILT") \
              || { echo "::error::build handed over no SHA-256 for $target"; exit 1; }
            grep -qx "$want  knoggin-$VERSION-$target.tar.gz" SHA256SUMS
            stamp="$stamp;s/@SHA256_$(tr 'a-z-' 'A-Z_' <<<"$target")@/$want/g"
            expected+=("knoggin-$VERSION-$target.tar.gz" "knoggin-$VERSION-$target.spdx.json")
          done
          sed "$stamp" ../install.sh | cmp - install.sh
          # Exactly these files, each named in SHA256SUMS, and nothing else.
          want_names=$(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          [ "$(awk '{ print $2 }' SHA256SUMS | LC_ALL=C sort)" = "$want_names" ]
          [ "$(find . -mindepth 1 -printf '%P\n' | grep -vx SHA256SUMS | LC_ALL=C sort)" = "$want_names" ]
          echo "install_sh=$(sha256sum install.sh | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-sh
          path: dist/install.sh
          if-no-files-found: error
          retention-days: 1
      # The bundle lets cosign check an archive without the GitHub API (install.sh does).
      - name: Upload, add the image digest to the notes, publish the draft
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$BUNDLE" "dist/knoggin-$VERSION.sigstore.json"
          gh release upload "$TAG" dist/*
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          printf "\n## Container image\n\n\`%s@%s\`\n" "$IMAGE" "$DIGEST" >> "$RUNNER_TEMP/notes.md"
          # A pre-release, or a release older than one already out, is not "Latest".
          kind="--latest=false"
          case "$VERSION" in
            *-*) kind="--prerelease" ;;
            *) if [ "$(scripts/newest-release.sh "$VERSION")" = "$VERSION" ]; then kind="--latest"; fi ;;
          esac
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --draft=false "$kind"

  # X.Y and latest move once the release is published, and only forward.
  image-tags:
    needs: [release-please, image, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-image-tags
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-index
          path: ${{ runner.temp }}
      - name: Move X.Y and latest
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${DIGEST#sha256:}  $RUNNER_TEMP/index.json" | sha256sum --strict -c -
          case "$VERSION" in
            *-*)
              echo "$VERSION is a pre-release: X.Y and latest stay where they are"
              exit 0
              ;;
          esac
          set --
          if [ "$(scripts/newest-release.sh "$VERSION" "${VERSION%.*}")" = "$VERSION" ]; then set -- "$@" "${VERSION%.*}"; fi
          if [ "$(scripts/newest-release.sh "$VERSION")" = "$VERSION" ]; then set -- "$@" latest; fi
          if [ $# -eq 0 ]; then
            echo "a newer release has X.Y and latest"
            exit 0
          fi
          digest=$(scripts/put-manifest.sh "$IMAGE" "$RUNNER_TEMP/index.json" "$@")
          [ "$digest" = "$DIGEST" ]

  # Last, after one manual approval of the pypi environment. The package carries the
  # release's stamped install.sh, which `knoggin init` runs.
  pypi:
    needs: [release-please, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-sh
          path: sdk/python/src/knoggin/cli
      - name: Check install.sh against the one publish checked
        env:
          WANT: ${{ needs.publish.outputs.install_sh }}
        run: echo "$WANT  src/knoggin/cli/install.sh" | sha256sum --strict -c -
      - name: Install uv
        run: |
          curl -fsSL -o "$RUNNER_TEMP/uv.whl" https://files.pythonhosted.org/packages/3d/aa/26d64642d808de4a652579ef950d7cd2d37f080a8babf9c67c6b75fc4c3f/uv-0.13.9-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          echo "d7f459fe4fd247d830351c75686d3996ace3c6f3f728eb0e85a30b7ada0cef19  $RUNNER_TEMP/uv.whl" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -j -o "$RUNNER_TEMP/uv.whl" uv-0.13.9.data/scripts/uv -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/uv"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: uv build
      - run: uv publish --trusted-publishing always
