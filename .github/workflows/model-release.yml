name: Model release

# Tab "Testing, CI, releases" and tab "Embeddings", Download and check: puts the pinned
# model files on a release tagged model-<identity string>, the second download source of
# `knoggin model fetch` and of the image's model stage. Started by hand.
#
# graph = published: the three files from Hugging Face at the pinned commit, as they are.
# graph = patched (measurement M5): the graph with accuracy_level = 4, made by
#   scripts/patch_q4_graph.py, with a notice that says it was modified, plus the same
#   weights and tokenizer. Give the identity string that the new graph_sha256 yields, and
#   run this before the release that names it (docs/maintainers.md, M5).

on:
  workflow_dispatch:
    inputs:
      graph:
        description: Which graph to publish
        type: choice
        options: [published, patched]
        default: published
      identity:
        description: The identity string; required for the patched graph
        type: string
        default: embeddinggemma-2-q4-768-80bc2e03328dae2f

permissions: {}

env:
  COMMIT: daa72c51243991dfcaf9f9137d2c573d8f7790c0
  PUBLISHED_GRAPH_SHA256: f9eeba97acddf139b8ee2ddf04bc30dceafa88de93fadf74d7644e0d61a477a9
  PATCHED_GRAPH_SHA256: 1afd951bf447f631786cc1302921f94d4bc30f602ee6a61e8e517d0a3203c8a8

jobs:
  # Downloads, checks and, for the patched graph, patches. No write permission: the patch
  # step runs third-party Python, so the result is checked again by its hash below.
  files:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and check the pinned files
        run: |
          mkdir -p "$RUNNER_TEMP/model"
          cd "$RUNNER_TEMP/model"
          for path in onnx/model_q4.onnx onnx/model_q4.onnx_data tokenizer.json; do
            curl -fsSL --retry 3 -o "${path##*/}" \
              "https://huggingface.co/onnx-community/embeddinggemma-2-ONNX/resolve/$COMMIT/$path"
          done
          printf '%s\n' \
            "$PUBLISHED_GRAPH_SHA256  model_q4.onnx" \
            "c3975f2d1ab7a1878ae31a7d7a9b7804a827aff3800b60dfceafce21cac3df49  model_q4.onnx_data" \
            "4d777ef5bdc1aa36227abdfb77c3e49e7b9c892d16e1b6bda41c393504828be4  tokenizer.json" \
            | sha256sum -c -
      - name: Install uv
        if: inputs.graph == 'patched'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/uv.whl" https://files.pythonhosted.org/packages/3d/aa/26d64642d808de4a652579ef950d7cd2d37f080a8babf9c67c6b75fc4c3f/uv-0.13.9-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          echo "d7f459fe4fd247d830351c75686d3996ace3c6f3f728eb0e85a30b7ada0cef19  $RUNNER_TEMP/uv.whl" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -j -o "$RUNNER_TEMP/uv.whl" uv-0.13.9.data/scripts/uv -d "$RUNNER_TEMP/bin"
          chmod +x "$RUNNER_TEMP/bin/uv"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Patch the graph and write its notice
        if: inputs.graph == 'patched'
        run: |
          cd "$RUNNER_TEMP/model"
          uv run --no-project --with onnx==1.23.2 python -I \
            "$GITHUB_WORKSPACE/scripts/patch_q4_graph.py" model_q4.onnx patched.onnx
          echo "$PATCHED_GRAPH_SHA256  patched.onnx" | sha256sum -c -
          mv patched.onnx model_q4.onnx
          cat > NOTICE-model_q4.onnx.txt <<EOF
          model_q4.onnx was modified by the Knoggin project.

          Source: onnx/model_q4.onnx of onnx-community/embeddinggemma-2-ONNX at commit
          $COMMIT (SHA-256 $PUBLISHED_GRAPH_SHA256), Apache License 2.0.

          Change: the attribute accuracy_level is set to 4 on every MatMulNBits node, so
          ONNX Runtime uses its 8-bit kernels (scripts/patch_q4_graph.py, onnx 1.23.2). The
          weights are unchanged. The modified file has SHA-256 $PATCHED_GRAPH_SHA256.
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model
          path: ${{ runner.temp }}/model/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: files
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model
          path: model
      - name: Check the files and upload them to model-<identity string>
        env:
          GRAPH: ${{ inputs.graph }}
          IDENTITY: ${{ inputs.identity }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$IDENTITY" in
            embeddinggemma-2-q4-768-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error::not an identity string: $IDENTITY"; exit 1 ;;
          esac
          if [ "$GRAPH" = patched ]; then
            graph="$PATCHED_GRAPH_SHA256"
            [ "$IDENTITY" != embeddinggemma-2-q4-768-80bc2e03328dae2f ] \
              || { echo "::error::the patched graph needs its own identity string"; exit 1; }
            [ -s model/NOTICE-model_q4.onnx.txt ] || { echo "::error::the notice is missing"; exit 1; }
          else
            graph="$PUBLISHED_GRAPH_SHA256"
            [ "$IDENTITY" = embeddinggemma-2-q4-768-80bc2e03328dae2f ] \
              || { echo "::error::the published graph has the identity embeddinggemma-2-q4-768-80bc2e03328dae2f"; exit 1; }
          fi
          printf '%s\n' \
            "$graph  model/model_q4.onnx" \
            "c3975f2d1ab7a1878ae31a7d7a9b7804a827aff3800b60dfceafce21cac3df49  model/model_q4.onnx_data" \
            "4d777ef5bdc1aa36227abdfb77c3e49e7b9c892d16e1b6bda41c393504828be4  model/tokenizer.json" \
            | sha256sum -c -
          # A model release is never replaced: its files are pinned by hash in every build.
          gh release create "model-$IDENTITY" model/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Model files $IDENTITY" --latest=false \
            --notes "The model files of identity $IDENTITY ($GRAPH graph), from onnx-community/embeddinggemma-2-ONNX at $COMMIT. Licence: Apache 2.0. The second download source of knoggin model fetch."
