# Tab "Testing, CI, releases": weekly, a 7-day cooldown, one group per ecosystem.
# fuzz/ is a Cargo workspace of its own, with its own Cargo.lock, so it has its own
# cargo entry. The docker entry reads deploy/Dockerfile.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # redb stays on 2.x: the recalld importer reads recalld's redb 2 files.
    ignore:
      - dependency-name: redb
        update-types: ["version-update:semver-major"]
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # redb stays on 2.x: the recalld importer reads recalld's redb 2 files.
    ignore:
      - dependency-name: redb
        update-types: ["version-update:semver-major"]
    groups:
      cargo-fuzz:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # TypeScript stays on 6.x until svelte-check and typescript-eslint accept 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /sdk/python
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
